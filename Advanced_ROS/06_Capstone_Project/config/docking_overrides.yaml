# Capstone overrides for the docking server, loaded AFTER amr_adv03
# config/docking_server_params.yaml (later parameter files win). The dock database entry
# (home_dock pose/frame) is generated by the launch file from config/capstone_mission.yaml.
docking_server:
  ros__parameters:
    use_sim_time: true            # Gazebo /clock
    controller:
      # The docking server declares "docked" as soon as the robot is within docking_threshold
      # (15 mm) of the detected dock pose - and the ground truth shows the robot is still driving
      # at full approach speed at that moment (no slow-down before the dock). It then overshoots
      # by about v * latency + v^2 / (2 a): with the module 03 value 0.15 m/s the real Gazebo
      # robot (20 Hz control, velocity_smoother, 1 m/s^2 braking) ended 4-16 mm past the dock,
      # once outside the threshold, so UndockRobot refused ("Robot is not in the dock").
      # At 0.10 m/s: 2.2-4.5 mm true error in 5 runs (results/kpi_repeatability.txt).
      v_linear_max: 0.10
