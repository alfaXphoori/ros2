# Open-RMF fleet adapter configuration for the warehouse AMR fleet
# (EasyFullControl schema of rmf_fleet_adapter 2.7.x / ROS 2 Jazzy).
#
# Loaded by EasyFullControl::FleetConfiguration::from_config_files(config, nav_graph)
# - Python: rmf_adapter.easy_full_control.FleetConfiguration.from_config_files(...)
#   Check it:  ros2 run amr_adv04 fleet_config_check
#
# Required keys: name, profile, limits, battery_system, mechanical_system,
# ambient_system, tool_system. Everything else has a default (printed when missing).
rmf_fleet:
  name: "warehouse_amr_fleet"
  limits:
    linear: [0.8, 0.5]       # nominal velocity (m/s), nominal acceleration (m/s^2)
    angular: [1.2, 1.5]      # nominal velocity (rad/s), nominal acceleration (rad/s^2)
  profile:                   # both are circles (radius, m) used by traffic conflict checks
    footprint: 0.3           # physical body: two footprints must never overlap
    vicinity: 0.5            # personal space: another robot's footprint must stay out of it
  reversible: false          # true = the planner may drive the robot backwards

  # ---- battery / energy model, used by the task planner (rmf_battery) ----
  battery_system:
    voltage: 24.0            # V
    capacity: 40.0           # Ah
    charging_current: 10.0   # A
  mechanical_system:         # motion power sink
    mass: 30.0               # kg
    moment_of_inertia: 2.0   # kg m^2
    friction_coefficient: 0.22
  ambient_system:
    power: 20.0              # W, electronics drawing power all the time
  tool_system:
    power: 0.0               # W, payload/tool power (none on this AMR)
  recharge_threshold: 0.20   # robot is sent to charge rather than go below 20 % SoC
  recharge_soc: 1.0          # charge up to 100 % on a ChargeBattery task
  account_for_battery_drain: true
  publish_fleet_state: 10.0  # Hz, FleetState publish rate
  max_delay: 10.0            # s of delay before the adapter replans

  # ---- what the dispatcher may assign to this fleet ----
  task_capabilities:
    loop: true               # "loop" is treated as "patrol"
    delivery: true
  actions: []                # custom perform_action categories (e.g. ["teleop"])
  finishing_request: "park"  # after a task: park | charge | nothing
  responsive_wait: true      # idle robots still take part in traffic negotiation

  # ---- known robots: the name must match the name the adapter registers ----
  # (the start position is NOT configured here: each robot reports its pose and
  #  the adapter localizes it on the nav graph when it is added)
  robots:
    amr_01:
      charger: "charger_alpha"   # must be an is_charger waypoint in nav_graph.yaml
    amr_02:
      charger: "charger_beta"
