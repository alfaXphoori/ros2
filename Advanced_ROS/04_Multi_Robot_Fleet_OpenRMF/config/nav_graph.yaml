# Minimal Open-RMF navigation graph for the Module 04 warehouse (one level "L1").
# Same format that rmf_building_map_tools (building_map_generator nav) writes
# and that rmf_fleet_adapter's parse_graph() reads:
#   vertices: [x, y, {options}]   (metres, map frame)
#   lanes:    [from_index, to_index, {options}]   (directed! add both directions)
#
#   charger_beta (0,1.5) --- junction_b (2,1.5) --------- dropoff_bay_2 (6,1.5)
#                                |                             |
#   charger_alpha (0,0) ---- junction_a (2,0) ----------- pickup_bay_1 (6,0)
#
# The chargers are where amr_01 / amr_02 start in multi_robot_fleet.launch.py.
building_name: kalasin_warehouse
doors: {}
lifts: {}
levels:
  L1:
    vertices:
      - [0.0, 0.0, {name: charger_alpha, is_charger: true, is_parking_spot: true, is_holding_point: true}]
      - [0.0, 1.5, {name: charger_beta, is_charger: true, is_parking_spot: true, is_holding_point: true}]
      - [2.0, 0.0, {name: junction_a}]
      - [2.0, 1.5, {name: junction_b, is_holding_point: true}]
      - [6.0, 0.0, {name: pickup_bay_1, is_holding_point: true}]
      - [6.0, 1.5, {name: dropoff_bay_2, is_holding_point: true}]
    lanes:
      - [0, 2, {speed_limit: 0.0}]
      - [2, 0, {speed_limit: 0.0}]
      - [1, 3, {speed_limit: 0.0}]
      - [3, 1, {speed_limit: 0.0}]
      - [2, 3, {speed_limit: 0.0}]
      - [3, 2, {speed_limit: 0.0}]
      - [2, 4, {speed_limit: 0.0}]
      - [4, 2, {speed_limit: 0.0}]
      - [3, 5, {speed_limit: 0.0}]
      - [5, 3, {speed_limit: 0.0}]
      - [4, 5, {speed_limit: 0.3}]   # narrow aisle between the bays: 0.3 m/s
      - [5, 4, {speed_limit: 0.3}]
