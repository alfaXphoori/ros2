# Nav2 Costmap Filters configuration (Keep-out Zone & Speed Restricted Zone)
# Used by launch/costmap_filters_demo.launch.py

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      footprint: "[ [0.20, 0.14], [0.20, -0.14], [-0.20, -0.14], [-0.20, 0.14] ]"
      plugins: ["static_layer", "inflation_layer"]
      filters: ["keepout_filter", "speed_filter"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"
        override_lethal_cost: true
        lethal_override_threshold: 100

      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: true
        filter_info_topic: "/speed_filter_info"
        speed_limit_topic: "/speed_limit"

map_server:
  ros__parameters:
    use_sim_time: false

keepout_filter_mask_server:
  ros__parameters:
    use_sim_time: false
    topic_name: "/keepout_filter_mask"

keepout_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 0
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

speed_filter_mask_server:
  ros__parameters:
    use_sim_time: false
    topic_name: "/speed_filter_mask"

speed_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 1
    filter_info_topic: "/speed_filter_info"
    mask_topic: "/speed_filter_mask"
    base: 100.0
    multiplier: -0.5
