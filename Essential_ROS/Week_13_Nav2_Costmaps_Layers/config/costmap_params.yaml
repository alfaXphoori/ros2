# Week 13 Lab: Global & Local Costmap 2D configuration for the course AMR.
# Used by launch/costmap_demo.launch.py (standalone nav2_costmap_2d nodes) and kept
# identical to the costmap sections of Week 14 config/nav2_params.yaml.
#
# Robot footprint (Week 07 URDF): chassis 0.40 m long, wheels at y = +-0.12 m with
# 0.04 m width -> outer width 0.28 m.
#   inscribed radius     = 0.14 m  (half width: closest edge to the centre)
#   circumscribed radius = sqrt(0.20^2 + 0.14^2) = 0.244 m (farthest corner)
# Published /…/costmap (nav_msgs/OccupancyGrid) is scaled to 0..100:
#   LETHAL 254 -> 100, INSCRIBED 253 -> 99, NO_INFORMATION 255 -> -1,
#   inflated 1..252 -> 1..98 ; raw 0..255 values are on /…/costmap_raw.

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      always_send_full_costmap: true

      # Footprint polygon [x, y] in base_footprint (metres)
      footprint: "[ [0.20, 0.14], [0.20, -0.14], [-0.20, -0.14], [-0.20, 0.14] ]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true

      footprint: "[ [0.20, 0.14], [0.20, -0.14], [-0.20, -0.14], [-0.20, 0.14] ]"

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map             # absolute: also works for a standalone namespaced costmap

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          obstacle_max_range: 9.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

map_server:
  ros__parameters:
    use_sim_time: true
    # yaml_filename is passed by the launch file (default: amr_week12 maps/warehouse_map.yaml)
