# SLAM Toolbox (Jazzy 2.8.x) online asynchronous mapping parameters for the course AMR.
# The top-level key MUST equal the node name. slam_toolbox's online_async_launch.py names
# the node `slam_toolbox`; a different key (e.g. async_slam_toolbox_node) is silently
# ignored and the node runs on built-in defaults.
slam_toolbox:
  ros__parameters:
    # Solver Parameters (Ceres non-linear least squares for the pose graph)
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frame Parameters (REP 105)
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    # Range thresholds: the Gazebo LiDAR (Week 07 URDF) measures 0.12 - 10.0 m
    max_laser_range: 10.0
    min_laser_range: 0.15
    minimum_time_interval: 0.2
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    transform_publish_period: 0.02
    map_update_interval: 2.0

    # Motion thresholds that trigger adding a new scan (graph node)
    minimum_travel_distance: 0.15
    minimum_travel_heading: 0.15

    # Map resolution [m/cell]
    resolution: 0.05

    # Scan matcher / graph
    use_scan_matching: true
    minimum_distance_penalty: 0.5
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    loop_search_maximum_distance: 5.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
