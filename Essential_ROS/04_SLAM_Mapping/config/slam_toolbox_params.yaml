# SLAM Toolbox Online Asynchronous Parameters for Differential Drive Robot
async_slam_toolbox_node:
  ros__parameters:
    # Solver Parameters
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frame Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    # Scan Matching & Range Thresholds
    max_laser_range: 12.0
    min_laser_range: 0.15
    minimum_time_interval: 0.2
    transform_timeout: 0.5
    tf_buffer_duration: 15.0

    # Motion Thresholds to trigger scan addition
    minimum_travel_distance: 0.15
    minimum_travel_heading: 0.15

    # Map Resolution & Graph Parameters
    resolution: 0.05
    max_laser_range: 12.0
    minimum_distance_penalty: 0.5
    distance_penalty_factor: 1.0
    angle_penalty_factor: 1.0
    loop_search_maximum_distance: 5.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
