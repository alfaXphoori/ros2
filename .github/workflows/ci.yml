name: ROS 2 AMR CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Fast checks that need no ROS installation
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python Scripts Syntax
        run: python -m py_compile $(git ls-files 'Essential_ROS/*.py' 'Advanced_ROS/*.py' 'scripts/*.py')

      - name: Check Markdown links (no broken relative links, no file:// links)
        run: python scripts/check_links.py

  # Build every lab package and run the automated tests inside the lab image
  # (same image students use: ROS 2 Jazzy + Gazebo Harmonic, headless, CPU only)
  build-and-test:
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 90
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free disk space for the ~6 GB lab image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build lab image
        run: make image

      - name: Lint YAML / XML / URDF
        run: make lint

      - name: colcon build + colcon test
        run: make test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-test-results
          path: |
            build/*/test_results/
            log/latest_test/
          if-no-files-found: ignore
