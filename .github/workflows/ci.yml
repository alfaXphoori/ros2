name: ROS 2 AMR CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python Scripts Syntax
        run: |
          echo "Compiling Python scripts and launch files..."
          python -m py_compile $(find Essential_ROS Advanced_ROS -name "*.py")
          echo "All Python nodes and launch files passed compilation check!"
